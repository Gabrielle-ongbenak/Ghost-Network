services:
  postgres:
    image: postgres:15-alpine
    container_name: ghost_postgres
    restart: unless-stopped
    networks:
      ghost_net:
        aliases:
          - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghost_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ghost_networks}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghost} -d ${POSTGRES_DB:-ghost_networks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: ghost_backend
    restart: unless-stopped
    networks:
      - ghost_net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ghost}:${POSTGRES_PASSWORD:-ghost_secret}@postgres:5432/${POSTGRES_DB:-ghost_networks}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      AUTO_SEED: ${AUTO_SEED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/seed:/data/seed
    command: >
      sh -c "python app/scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

networks:
  ghost_net:
    driver: bridge