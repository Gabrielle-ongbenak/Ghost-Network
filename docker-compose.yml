services:
  postgres:
    image: postgres:15-alpine
    container_name: ghost_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghost_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ghost_networks}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghost} -d ${POSTGRES_DB:-ghost_networks}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghost_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ghost}:${POSTGRES_PASSWORD:-ghost_secret}@postgres:5432/${POSTGRES_DB:-ghost_networks}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      AUTO_SEED: ${AUTO_SEED:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/seed:/data/seed
    command: >
      sh -c "python app/scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ghost_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000/api}
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
